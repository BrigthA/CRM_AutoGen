name: ai-crm

services:
  backend:
    build:
      context: .
      target: backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      CRM_DB_URL: sqlite:////app/data/crm.db
      RAG_INDEX_DIR: /app/data/rag_index
      AGENT_AUDIT_CSV: /app/data/agent_audit.csv
      HF_HOME: /home/app/.cache/huggingface
    volumes:
      - crm_data:/app/data
      - hf_cache:/home/app/.cache/huggingface
    networks:
      - crm_internal
    ports:
      - "127.0.0.1:8001:8000"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  frontend:
    build:
      context: .
      target: frontend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      API_URL: http://backend:8000
      PUBLIC_API_URL: https://${CRM_DOMAIN:?Set CRM_DOMAIN in .env}/api
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - crm_internal
    ports:
      - "127.0.0.1:8502:8501"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

networks:
  crm_internal:
    driver: bridge

volumes:
  crm_data:
  hf_cache:

